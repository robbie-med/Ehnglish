[project]
name = "ehnglish-server"
version = "0.0.1"
description = "Ehnglish assessment server: FastAPI + Postgres + CPU job queue"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "numpy>=2.5.3",
    "praat-parselmouth>=0.4.7",
    "spacy>=3.8.16",
    "wordfreq>=3.1.1",
    "rapidfuzz>=3.14.6",
    "anthropic>=1.9.0",
    "cmudict>=1.1.3",
    "en-core-web-sm",
    "errant>=3.0.2",
    "azure-cognitiveservices-speech>=1.52.0",
]

[project.optional-dependencies]
phonemes = ["torch>=2.4", "transformers>=4.44"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }
