# Core form F (monthly core, ~22 min). Parallel to forms A–E; completes the six-form rotation so
# any one form returns only every six months. Drafted to spec; native-speaker edit pending
# (REVIEW.md). C2 syllable targets are recomputed from CMUdict before audio is built.
id: core-F
version: 1
kind: core
title:
  en: "Monthly core — form F"
  ko: "월간 핵심 시험 — F형"
tasks:
  - id: C0
    type: silence
    title:
      en: "Room noise"
      ko: "실내 소음"
    instructions:
      en: "Stay completely silent for 10 seconds so the app can measure the room."
      ko: "앱이 실내 소음을 측정할 수 있도록 10초 동안 완전히 조용히 있어 주세요."
    timing: { prep_s: 2, respond_s: 10 }
    allow_rerecord: true
    items:
      - id: C0-silence
        target: { purpose: noise_floor }

  - id: C1
    type: read_aloud
    title:
      en: "Read aloud"
      ko: "소리 내어 읽기"
    instructions:
      en: "Read the paragraph aloud at a natural pace, then the ten words one at a time. Recording starts after the countdown."
      ko: "문단을 자연스러운 속도로 소리 내어 읽은 뒤, 열 개의 단어를 하나씩 읽으세요. 카운트다운 후 녹음이 시작됩니다."
    timing: { prep_s: 5, respond_s: 75, max_s: 90 }
    allow_rerecord: true
    items:
      - id: C1-para
        timing: { prep_s: 5, respond_s: 60, max_s: 75 }
        text: >-
          This is a message from the physical therapy office about your first visit on Wednesday.
          Please wear loose clothing and comfortable shoes, and bring the referral from your doctor
          along with your insurance card. The first appointment lasts about an hour, because the
          therapist will measure how far you can bend and lift before building a plan. Most plans
          allow twelve visits, and after that we need a new approval from your insurer. If you feel
          sharp pain during any exercise at home, stop and call us; soreness is normal, but pain is not.
        target:
          words: 93
          contrasts: ["r/l", "f/p", "v/b", "z/dʒ", "θ/s", "i/ɪ", "final consonants", "clusters"]
      - id: C1-words
        timing: { prep_s: 3, respond_s: 25, max_s: 30 }
        text: "therapist, physical, referral, flexible, shoulder, twelve, approval, soreness, lift, Wednesday"
        target:
          words: 10
          contrasts_per_word:
            therapist: ["θ/s", "r/l", "final st"]
            physical: ["f/p", "z/s", "final l"]
            referral: ["r/l", "f/p", "final l"]
            flexible: ["f/p", "l", "clusters"]
            shoulder: ["ʃ", "l", "final ɚ"]
            twelve: ["clusters", "v/b", "final lv"]
            approval: ["p", "r/l", "v/b"]
            soreness: ["s", "r/l", "final s"]
            lift: ["l", "i/ɪ", "final ft"]
            Wednesday: ["z/s", "clusters"]

  - id: C2
    type: sentence_repeat
    title:
      en: "Repeat the sentence"
      ko: "문장 따라 말하기"
    instructions:
      en: "You will hear each sentence once. After the beep, repeat it exactly. The sentences get longer."
      ko: "각 문장을 한 번만 듣게 됩니다. 삐 소리 후 정확히 따라 말하세요. 문장은 점점 길어집니다."
    timing: { prep_s: 0, respond_s: 8, max_s: 10 }
    tone_hz: 880
    allow_rerecord: false
    items:
      - { id: C2-01, text: "The office is on the right.", audio: audio/core-F/C2-01.wav, target: { syllables: 7 } }
      - { id: C2-02, text: "Please wear comfortable shoes.", audio: audio/core-F/C2-02.wav, target: { syllables: 7 } }
      - { id: C2-03, text: "My shoulder hurts when I lift.", audio: audio/core-F/C2-03.wav, target: { syllables: 7 } }
      - { id: C2-04, text: "The therapist will show you the exercises.", audio: audio/core-F/C2-04.wav, target: { syllables: 12 } }
      - { id: C2-05, text: "I would like to book a session for next Thursday.", audio: audio/core-F/C2-05.wav, target: { syllables: 12 } }
      - { id: C2-06, text: "Stretch slowly and stop if it hurts.", audio: audio/core-F/C2-06.wav, target: { syllables: 8 } }
      - { id: C2-07, text: "The doctor said the soreness should fade in a week.", audio: audio/core-F/C2-07.wav, target: { syllables: 13 } }
      - { id: C2-08, text: "Could you send the referral to my new therapist?", audio: audio/core-F/C2-08.wav, target: { syllables: 13 } }
      - { id: C2-09, text: "The first visit went well, but my knee was stiff afterward.", audio: audio/core-F/C2-09.wav, target: { syllables: 14 } }
      - { id: C2-10, text: "If the pain is sharp rather than sore, skip the exercise.", audio: audio/core-F/C2-10.wav, target: { syllables: 14 } }
      - { id: C2-11, text: "She asked whether the insurance would cover twelve sessions.", audio: audio/core-F/C2-11.wav, target: { syllables: 14 } }
      - { id: C2-12, text: "The assistant mentioned that the clinic only takes referrals on weekdays.", audio: audio/core-F/C2-12.wav, target: { syllables: 19 } }
      - { id: C2-13, text: "Although the exercises were simple, I felt the difference after a few days.", audio: audio/core-F/C2-13.wav, target: { syllables: 21 } }
      - { id: C2-14, text: "The insurance company requires a new approval after the twelfth visit.", audio: audio/core-F/C2-14.wav, target: { syllables: 21 } }
      - { id: C2-15, text: "Before you leave, please book your next three sessions at the front desk.", audio: audio/core-F/C2-15.wav, target: { syllables: 15 } }
      - { id: C2-16, text: "My neighbor assumed the therapist was a doctor, but nobody had told her otherwise.", audio: audio/core-F/C2-16.wav, target: { syllables: 23 } }
      - { id: C2-17, text: "The thermometer read a hundred and one, so I canceled the session for today.", audio: audio/core-F/C2-17.wav, target: { syllables: 21 } }
      - { id: C2-18, text: "Unless the stiffness improves by next week, they would like to try a different plan.", audio: audio/core-F/C2-18.wav, target: { syllables: 20 } }
      - { id: C2-19, text: "The receptionist apologized for the delay and offered a session later in the week.", audio: audio/core-F/C2-19.wav, target: { syllables: 24 } }
      - { id: C2-20, text: "Even though the referral had expired, the clinic agreed to see me one more time.", audio: audio/core-F/C2-20.wav, target: { syllables: 21 } }

  - id: C3
    type: quick_answer
    title:
      en: "Quick answers"
      ko: "빠른 대답"
    instructions:
      en: "You will hear a short question. Answer right away in a full sentence. Speed matters more than perfection."
      ko: "짧은 질문을 듣게 됩니다. 바로 완전한 문장으로 대답하세요. 완벽함보다 속도가 중요합니다."
    timing: { prep_s: 0, respond_s: 12, max_s: 15 }
    tone_hz: 880
    allow_rerecord: false
    items:
      - { id: C3-01, text: "What kind of exercise do you enjoy?", audio: audio/core-F/C3-01.wav, target: { type: personal } }
      - { id: C3-02, text: "How long does it take you to get to the clinic?", audio: audio/core-F/C3-02.wav, target: { type: personal } }
      - { id: C3-03, text: "What would you say if the therapist asked where exactly it hurts?", audio: audio/core-F/C3-03.wav, target: { type: patient_side } }
      - { id: C3-04, text: "Why do people need a referral before seeing a specialist?", audio: audio/core-F/C3-04.wav, target: { type: explain } }
      - { id: C3-05, text: "What is the difference between soreness and pain?", audio: audio/core-F/C3-05.wav, target: { type: compare } }
      - { id: C3-06, text: "If an exercise made your knee hurt, what would you tell the therapist?", audio: audio/core-F/C3-06.wav, target: { type: hypothetical } }

  - id: C4
    type: phone_call
    title:
      en: "Phone call"
      ko: "전화 통화"
    instructions:
      en: "You will call a clinic's billing office. The person on the line speaks, then you reply. Your goals are shown on screen during the call. Speak naturally; the line sounds like a real phone."
      ko: "병원 수납 부서에 전화를 겁니다. 상대방이 말한 뒤 당신이 대답합니다. 통화 중 목표가 화면에 표시됩니다. 자연스럽게 말하세요. 실제 전화처럼 들립니다."
    timing: { prep_s: 0, respond_s: 15, max_s: 18 }
    allow_rerecord: false
    target:
      scenario: "Call the billing office about a bill that seems to charge you twice for one visit, ask for an itemized statement, and ask for a payment plan for the rest."
      goals:
        - "States who they are and why they are calling (a bill that looks doubled)."
        - "Gives the account number or date of birth when asked."
        - "Explains what looks wrong (two charges for one visit)."
        - "Asks for an itemized statement."
        - "Asks about a payment plan for the remaining balance."
        - "Ends the call politely (thanks, goodbye)."
      phrases: ["I'm calling about my bill", "I was charged twice", "an itemized statement", "a payment plan", "thank you"]
    items:
      - id: C4-01
        text: "Billing department, this is Alex. How can I help?"
        audio: audio/core-F/C4-01.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Your goal: fix a bill. Say who you are and why you're calling."
          ko: "목표: 청구서 바로잡기. 누구인지, 왜 전화했는지 말하세요."
      - id: C4-02
        text: "Sure, let me pull that up. Do you have the account number, or I can use your date of birth."
        audio: audio/core-F/C4-02.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Give your date of birth (any date is fine)."
          ko: "생년월일을 말하세요 (아무 날짜나 괜찮습니다)."
      - id: C4-03
        text: "Okay, I've got it. What looks wrong to you?"
        audio: audio/core-F/C4-03.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Explain that there are two charges for the same visit in June."
          ko: "6월의 같은 진료에 두 번 청구된 것 같다고 설명하세요."
      - id: C4-04
        text: "Hm, I do see two line items on that date. One may be the facility fee. Would you like a breakdown?"
        audio: audio/core-F/C4-04.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Ask for an itemized statement to be mailed or emailed."
          ko: "항목별 명세서를 우편이나 이메일로 보내 달라고 요청하세요."
      - id: C4-05
        text: "I'll send the itemized statement today. The remaining balance is two hundred and ten dollars."
        audio: audio/core-F/C4-05.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Ask whether you can set up a payment plan."
          ko: "분할 납부가 가능한지 물어보세요."
      - id: C4-06
        text: "We can do three monthly payments with no interest. I'll note that on the account. Anything else?"
        audio: audio/core-F/C4-06.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Say that works, and end the call politely."
          ko: "그렇게 하겠다고 말하고 정중하게 통화를 마치세요."

  - id: C5
    type: describe_opinion
    title:
      en: "Describe, then give an opinion"
      ko: "묘사하기, 그리고 의견 말하기"
    instructions:
      en: "First, describe the process for 90 seconds. Then you get 30 seconds to think about a question and 90 seconds to answer it."
      ko: "먼저 과정을 90초 동안 설명하세요. 그다음 질문에 대해 30초 동안 생각하고 90초 동안 대답합니다."
    timing: { prep_s: 10, respond_s: 90, max_s: 95 }
    allow_rerecord: false
    items:
      - id: C5-describe
        prompt:
          en: "Describe, step by step, what happens from the moment you feel sick at work until you are back at your desk the next day."
          ko: "직장에서 몸이 아프다고 느낀 순간부터 다음 날 자리로 돌아올 때까지 무슨 일이 일어나는지 단계별로 설명하세요."
        timing: { prep_s: 10, respond_s: 90, max_s: 95 }
        target: { stage: describe, genre: process }
      - id: C5-opinion
        prompt:
          en: "Some people think employers should give unlimited sick days. Do you agree? Give reasons."
          ko: "고용주가 병가를 무제한으로 주어야 한다고 생각하는 사람들이 있습니다. 동의하나요? 이유를 말하세요."
        timing: { prep_s: 30, respond_s: 90, max_s: 95 }
        target: { stage: opinion }

  - id: C6
    type: dictation
    title:
      en: "Dictation"
      ko: "받아쓰기"
    instructions:
      en: "You will hear twelve sentences, each once. Some are fast, some sound like a phone, some have background noise. Type exactly what you hear, then press Done."
      ko: "열두 문장을 각각 한 번씩 듣습니다. 어떤 것은 빠르고, 어떤 것은 전화처럼 들리고, 어떤 것은 배경 소음이 있습니다. 들은 대로 정확히 입력한 뒤 완료를 누르세요."
    timing: { prep_s: 0, respond_s: 25 }
    allow_rerecord: false
    items:
      - { id: C6-01, text: "Your first session is on Wednesday at ten.", audio: audio/core-F/C6-01.wav, target: { condition: clear } }
      - { id: C6-02, text: "The therapist would like to see you twice a week.", audio: audio/core-F/C6-02.wav, target: { condition: clear } }
      - { id: C6-03, text: "Please bring the referral and your insurance card.", audio: audio/core-F/C6-03.wav, target: { condition: clear } }
      - { id: C6-04, text: "Soreness after exercise is normal, but sharp pain is not.", audio: audio/core-F/C6-04.wav, fx: { rate: "+35%" }, target: { condition: fast } }
      - { id: C6-05, text: "Most plans allow twelve visits before a new approval.", audio: audio/core-F/C6-05.wav, fx: { rate: "+35%" }, target: { condition: fast } }
      - { id: C6-06, text: "Wear loose clothing and comfortable shoes to every visit.", audio: audio/core-F/C6-06.wav, fx: { rate: "+35%" }, target: { condition: fast } }
      - { id: C6-07, text: "The remaining balance is two hundred and ten dollars.", audio: audio/core-F/C6-07.wav, fx: { phone: true }, target: { condition: phone } }
      - { id: C6-08, text: "We can set up three monthly payments with no interest.", audio: audio/core-F/C6-08.wav, fx: { phone: true }, target: { condition: phone } }
      - { id: C6-09, text: "The itemized statement will go out in today's mail.", audio: audio/core-F/C6-09.wav, fx: { phone: true }, target: { condition: phone } }
      - { id: C6-10, text: "Stop the exercise and call us if the pain is sharp.", audio: audio/core-F/C6-10.wav, fx: { noise_snr_db: 5, noise_kind: babble }, target: { condition: noise } }
      - { id: C6-11, text: "The clinic is on the third floor, across from the gym.", audio: audio/core-F/C6-11.wav, fx: { noise_snr_db: 5, noise_kind: babble }, target: { condition: noise } }
      - { id: C6-12, text: "You can book your next three sessions online tonight.", audio: audio/core-F/C6-12.wav, fx: { noise_snr_db: 5, noise_kind: babble }, target: { condition: noise } }

  - id: C7
    type: rating
    title:
      en: "Confidence"
      ko: "자신감"
    instructions:
      en: "How confident do you feel speaking English in each situation right now? Move the slider and press Next."
      ko: "지금 각 상황에서 영어로 말하는 것이 얼마나 자신 있나요? 슬라이더를 움직이고 다음을 누르세요."
    timing: { prep_s: 0, respond_s: 60 }
    allow_rerecord: false
    items:
      - { id: C7-phone, prompt: { en: "On the phone", ko: "전화 통화에서" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
      - { id: C7-doctor, prompt: { en: "At the doctor's office", ko: "병원에서" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
      - { id: C7-colleagues, prompt: { en: "With colleagues", ko: "동료들과" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
      - { id: C7-church, prompt: { en: "At church", ko: "교회에서" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
      - { id: C7-class, prompt: { en: "In class", ko: "수업에서" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
