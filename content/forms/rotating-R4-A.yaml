# Rotating module R4, form A (~9 min): a patient-side functional email (8 min) scored by checklist,
# accuracy, complexity and keystroke measures; a 30 s typing check; the speaking-anxiety scale.
id: rotating-R4-A
version: 1
kind: rotating
title:
  en: "Writing — form A"
  ko: "쓰기 — A형"
tasks:
  - id: R4-email
    type: typed_response
    title: { en: "Email to the clinic", ko: "병원에 보내는 이메일" }
    instructions:
      en: "Write an email to your clinic. You have eight minutes. Cover every point in the task; the email is scored on the points covered, accuracy and clarity, not on length."
      ko: "병원에 이메일을 쓰세요. 8분입니다. 과제의 모든 요점을 다루세요. 길이가 아니라 다룬 요점, 정확성, 명료성으로 평가합니다."
    timing: { prep_s: 15, respond_s: 480 }
    target:
      goals:
        - "Identifies themselves (name) and the appointment or test in question."
        - "Asks for the blood test results from last week."
        - "Asks to reschedule the follow-up visit from Thursday to the following week."
        - "Gives at least one specific alternative day or time."
        - "Asks whether the prescription can be renewed before the visit."
        - "Closes politely with a request for confirmation."
    items:
      - id: R4-email-1
        prompt:
          en: "You had a blood test last week and a follow-up visit booked for this Thursday. Write to the clinic: ask for the test results, ask to move the follow-up to next week (suggest a day or time), and ask whether your prescription can be renewed before the visit. Ask them to confirm."
          ko: "지난주에 혈액 검사를 받았고 이번 주 목요일에 후속 진료가 예약되어 있습니다. 병원에 이메일을 쓰세요: 검사 결과를 요청하고, 후속 진료를 다음 주로 옮겨 달라고 하고(요일이나 시간을 제안), 진료 전에 처방전을 갱신할 수 있는지 물어보세요. 확인을 요청하세요."
        target: { language: en, genre: email }

  - id: R4-typing
    type: copy_typing
    title: { en: "Typing check", ko: "타이핑 점검" }
    instructions: { en: "Copy the text as fast as you comfortably can. Thirty seconds.", ko: "편안한 한도에서 최대한 빠르게 글을 따라 입력하세요. 30초입니다." }
    timing: { prep_s: 0, respond_s: 30 }
    items:
      - id: R4-typing-1
        text: "Please let me know whether the afternoon slot is still available, and whether I should bring the old prescription with me when I come in."
        target: { language: en }

  - id: R4-anxiety
    type: rating
    title: { en: "Speaking anxiety", ko: "말하기 불안" }
    instructions: { en: "Rate each statement from 0 (not at all true) to 10 (completely true).", ko: "각 문장을 0(전혀 아니다)에서 10(완전히 그렇다)까지 평가하세요." }
    timing: { prep_s: 0, respond_s: 60 }
    items:
      - { id: S-anx-1, prompt: { en: "I feel nervous when I have to speak English without preparing.", ko: "준비 없이 영어로 말해야 할 때 긴장된다." }, scale: { min: 0, max: 10 }, target: { scale_name: anxiety } }
      - { id: S-anx-2, prompt: { en: "I worry about making mistakes when I speak English.", ko: "영어로 말할 때 실수할까 봐 걱정된다." }, scale: { min: 0, max: 10 }, target: { scale_name: anxiety } }
      - { id: S-anx-3, prompt: { en: "My mind goes blank when someone asks me something in English.", ko: "누가 영어로 무언가를 물으면 머리가 하얘진다." }, scale: { min: 0, max: 10 }, target: { scale_name: anxiety } }
      - { id: S-anx-4, prompt: { en: "I avoid phone calls in English when I can.", ko: "가능하면 영어 전화 통화를 피한다." }, scale: { min: 0, max: 10 }, target: { scale_name: anxiety } }
      - { id: S-anx-5, prompt: { en: "I feel relaxed speaking English in casual conversation.", ko: "가벼운 대화에서는 영어로 말하는 것이 편안하다." }, scale: { min: 0, max: 10 }, target: { scale_name: anxiety, reverse: true } }
      - { id: S-anx-6, prompt: { en: "I feel confident speaking English with people I don't know.", ko: "모르는 사람과 영어로 말하는 것이 자신 있다." }, scale: { min: 0, max: 10 }, target: { scale_name: anxiety, reverse: true } }
