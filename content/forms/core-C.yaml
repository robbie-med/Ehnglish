# Core form C (monthly core, ~22 min). Parallel to forms A and B. Drafted to spec; native-speaker
# edit pending (REVIEW.md). C2 syllable targets are recomputed from CMUdict before audio is built.
id: core-C
version: 1
kind: core
title:
  en: "Monthly core — form C"
  ko: "월간 핵심 시험 — C형"
tasks:
  - id: C0
    type: silence
    title:
      en: "Room noise"
      ko: "실내 소음"
    instructions:
      en: "Stay completely silent for 10 seconds so the app can measure the room."
      ko: "앱이 실내 소음을 측정할 수 있도록 10초 동안 완전히 조용히 있어 주세요."
    timing: { prep_s: 2, respond_s: 10 }
    allow_rerecord: true
    items:
      - id: C0-silence
        target: { purpose: noise_floor }

  - id: C1
    type: read_aloud
    title:
      en: "Read aloud"
      ko: "소리 내어 읽기"
    instructions:
      en: "Read the paragraph aloud at a natural pace, then the ten words one at a time. Recording starts after the countdown."
      ko: "문단을 자연스러운 속도로 소리 내어 읽은 뒤, 열 개의 단어를 하나씩 읽으세요. 카운트다운 후 녹음이 시작됩니다."
    timing: { prep_s: 5, respond_s: 75, max_s: 90 }
    allow_rerecord: true
    items:
      - id: C1-para
        text: >-
          Thank you for calling the urgent care center. We are open from eight in the morning until
          nine at night, seven days a week, and no appointment is needed. If you are having chest pain,
          severe bleeding, or trouble breathing, hang up and dial nine one one. For a flu shot, a rash,
          a sprained wrist, or a sore throat, just walk in and bring your insurance card and a photo ID.
          Most visits take less than an hour. Lab results are usually ready within three days, and we
          will leave a message if anything needs a follow-up.
        target:
          words: 88
          contrasts: ["r/l", "f/p", "v/b", "z/dʒ", "θ/s", "i/ɪ", "final consonants", "clusters"]
      - id: C1-words
        text: "bleeding, wrist, vaccine, follow-up, throat, pharmacist, visit, refill, thirteen, zip code"
        target:
          words: 10
          contrasts_per_word:
            bleeding: ["l", "i/ɪ", "final ŋ"]
            wrist: ["r/l", "i/ɪ", "clusters"]
            vaccine: ["v/b", "i/ɪ"]
            follow-up: ["f/p", "l", "final p"]
            throat: ["θ/s", "r/l", "final t"]
            pharmacist: ["f/p", "r/l", "final st"]
            visit: ["v/b", "z/s", "final t"]
            refill: ["r/l", "f/p", "final l"]
            thirteen: ["θ/s", "r/l", "i/ɪ"]
            zip code: ["z/dʒ", "i/ɪ", "final d"]

  - id: C2
    type: sentence_repeat
    title:
      en: "Repeat the sentence"
      ko: "문장 따라 말하기"
    instructions:
      en: "You will hear each sentence once. After the beep, repeat it exactly. The sentences get longer."
      ko: "각 문장을 한 번만 듣게 됩니다. 삐 소리 후 정확히 따라 말하세요. 문장은 점점 길어집니다."
    timing: { prep_s: 0, respond_s: 8, max_s: 10 }
    tone_hz: 880
    allow_rerecord: false
    items:
      - { id: C2-01, text: "The lab is on the left.", audio: audio/core-C/C2-01.wav, target: { syllables: 6 } }
      - { id: C2-02, text: "Please take a seat by the window.", audio: audio/core-C/C2-02.wav, target: { syllables: 8 } }
      - { id: C2-03, text: "Her fever broke early this morning.", audio: audio/core-C/C2-03.wav, target: { syllables: 9 } }
      - { id: C2-04, text: "The pharmacist will explain the dosage.", audio: audio/core-C/C2-04.wav, target: { syllables: 10 } }
      - { id: C2-05, text: "I think my insurance card has expired.", audio: audio/core-C/C2-05.wav, target: { syllables: 10 } }
      - { id: C2-06, text: "Drink plenty of water and get some rest.", audio: audio/core-C/C2-06.wav, target: { syllables: 10 } }
      - { id: C2-07, text: "The receptionist said the doctor is running late.", audio: audio/core-C/C2-07.wav, target: { syllables: 13 } }
      - { id: C2-08, text: "Could you spell your last name for me, please?", audio: audio/core-C/C2-08.wav, target: { syllables: 9 } }
      - { id: C2-09, text: "The results were normal, so no follow-up is needed.", audio: audio/core-C/C2-09.wav, target: { syllables: 14 } }
      - { id: C2-10, text: "If you miss a dose, take it as soon as you remember.", audio: audio/core-C/C2-10.wav, target: { syllables: 14 } }
      - { id: C2-11, text: "He asked whether the clinic offered evening appointments.", audio: audio/core-C/C2-11.wav, target: { syllables: 14 } }
      - { id: C2-12, text: "The nurse explained that the vaccine needs two doses, a month apart.", audio: audio/core-C/C2-12.wav, target: { syllables: 16 } }
      - { id: C2-13, text: "Although I arrived early, I waited nearly an hour to be seen.", audio: audio/core-C/C2-13.wav, target: { syllables: 18 } }
      - { id: C2-14, text: "The insurance company requested additional paperwork from the specialist.", audio: audio/core-C/C2-14.wav, target: { syllables: 22 } }
      - { id: C2-15, text: "Before you go, please confirm your phone number and your pharmacy.", audio: audio/core-C/C2-15.wav, target: { syllables: 16 } }
      - { id: C2-16, text: "My coworker thought the deadline was Friday, but nobody had told her it moved.", audio: audio/core-C/C2-16.wav, target: { syllables: 20 } }
      - { id: C2-17, text: "The thermometer kept reading a hundred, so I decided to keep her home.", audio: audio/core-C/C2-17.wav, target: { syllables: 20 } }
      - { id: C2-18, text: "Unless the rash spreads over the next two days, they would rather not change the medicine.", audio: audio/core-C/C2-18.wav, target: { syllables: 21 } }
      - { id: C2-19, text: "The receptionist apologized for the mix-up and found an earlier appointment for us.", audio: audio/core-C/C2-19.wav, target: { syllables: 24 } }
      - { id: C2-20, text: "Even though the office had closed, the on-call nurse answered within a few minutes.", audio: audio/core-C/C2-20.wav, target: { syllables: 20 } }

  - id: C3
    type: quick_answer
    title:
      en: "Quick answers"
      ko: "빠른 대답"
    instructions:
      en: "You will hear a short question. Answer right away in a full sentence. Speed matters more than perfection."
      ko: "짧은 질문을 듣게 됩니다. 바로 완전한 문장으로 대답하세요. 완벽함보다 속도가 중요합니다."
    timing: { prep_s: 0, respond_s: 12, max_s: 15 }
    tone_hz: 880
    allow_rerecord: false
    items:
      - { id: C3-01, text: "What do you usually do on Sunday afternoons?", audio: audio/core-C/C3-01.wav, target: { type: personal } }
      - { id: C3-02, text: "How far is the nearest pharmacy from your home?", audio: audio/core-C/C3-02.wav, target: { type: personal } }
      - { id: C3-03, text: "What would you say if the nurse asked whether you have any allergies?", audio: audio/core-C/C3-03.wav, target: { type: patient_side } }
      - { id: C3-04, text: "Why do doctors ask you to bring a list of your medications?", audio: audio/core-C/C3-04.wav, target: { type: explain } }
      - { id: C3-05, text: "What is the difference between urgent care and an emergency room?", audio: audio/core-C/C3-05.wav, target: { type: compare } }
      - { id: C3-06, text: "If a prescription made you feel dizzy, what would you do?", audio: audio/core-C/C3-06.wav, target: { type: hypothetical } }

  - id: C4
    type: phone_call
    title:
      en: "Phone call"
      ko: "전화 통화"
    instructions:
      en: "You will call your insurance company. The person on the line speaks, then you reply. Your goals are shown on screen during the call. Speak naturally; the line sounds like a real phone."
      ko: "보험회사에 전화를 겁니다. 상대방이 말한 뒤 당신이 대답합니다. 통화 중 목표가 화면에 표시됩니다. 자연스럽게 말하세요. 실제 전화처럼 들립니다."
    timing: { prep_s: 0, respond_s: 15, max_s: 18 }
    allow_rerecord: false
    target:
      scenario: "Call your insurance company about a bill for a visit that should have been covered, ask why it was denied, and ask how to appeal."
      goals:
        - "States who they are and why they are calling (a bill they think should be covered)."
        - "Gives the member ID or date of birth when asked."
        - "Names the visit (date or type) in question."
        - "Asks why the claim was denied."
        - "Asks how to appeal or what to send."
        - "Ends the call politely (thanks, goodbye)."
      phrases: ["I'm calling about a bill", "why was it denied", "how do I appeal", "thank you"]
    items:
      - id: C4-01
        text: "Thank you for calling member services, this is Jordan. How can I help you today?"
        audio: audio/core-C/C4-01.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Your goal: sort out a bill. Say who you are and why you're calling."
          ko: "목표: 청구서 문제 해결. 누구인지, 왜 전화했는지 말하세요."
      - id: C4-02
        text: "I can look into that. Can I have your member ID, or your date of birth if you don't have the card handy?"
        audio: audio/core-C/C4-02.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Give your date of birth (any date is fine)."
          ko: "생년월일을 말하세요 (아무 날짜나 괜찮습니다)."
      - id: C4-03
        text: "Thanks. I see a few claims here. Which visit is this about?"
        audio: audio/core-C/C4-03.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Say which visit it was (for example, the urgent care visit in March)."
          ko: "어떤 진료였는지 말하세요 (예: 3월의 긴급 진료)."
      - id: C4-04
        text: "Okay, I see that one. It was denied because the provider billed it as out of network."
        audio: audio/core-C/C4-04.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Say you believe the clinic is in your network, and ask why it was denied."
          ko: "그 병원이 네트워크 안에 있다고 생각한다고 말하고, 왜 거부되었는지 물어보세요."
      - id: C4-05
        text: "You can file an appeal. You'd need to send us the itemized bill and a short letter explaining the situation."
        audio: audio/core-C/C4-05.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Ask how to send the appeal and how long it takes."
          ko: "이의 신청을 어떻게 보내는지, 얼마나 걸리는지 물어보세요."
      - id: C4-06
        text: "You can upload it in the app or mail it in. Appeals usually take about thirty days. Anything else?"
        audio: audio/core-C/C4-06.wav
        fx: { voice: en-US-AvaNeural, phone: true }
        prompt:
          en: "Say no, and end the call politely."
          ko: "없다고 말하고 정중하게 통화를 마치세요."

  - id: C5
    type: describe_opinion
    title:
      en: "Describe, then give an opinion"
      ko: "묘사하기, 그리고 의견 말하기"
    instructions:
      en: "First, describe the process for 90 seconds. Then you get 30 seconds to think about a question and 90 seconds to answer it."
      ko: "먼저 과정을 90초 동안 설명하세요. 그다음 질문에 대해 30초 동안 생각하고 90초 동안 대답합니다."
    timing: { prep_s: 10, respond_s: 90, max_s: 95 }
    allow_rerecord: false
    items:
      - id: C5-describe
        prompt:
          en: "Describe, step by step, what happens when you call a clinic to make a new appointment, from dialing the number to hanging up."
          ko: "병원에 전화해서 새 예약을 잡을 때, 번호를 누르는 순간부터 전화를 끊을 때까지 무슨 일이 일어나는지 단계별로 설명하세요."
        timing: { prep_s: 10, respond_s: 90, max_s: 95 }
        target: { stage: describe, genre: process }
      - id: C5-opinion
        prompt:
          en: "Some people think doctors should always explain test results by phone instead of by letter or app. Do you agree? Give reasons."
          ko: "의사가 검사 결과를 편지나 앱 대신 항상 전화로 설명해야 한다고 생각하는 사람들이 있습니다. 동의하나요? 이유를 말하세요."
        timing: { prep_s: 30, respond_s: 90, max_s: 95 }
        target: { stage: opinion }

  - id: C6
    type: dictation
    title:
      en: "Dictation"
      ko: "받아쓰기"
    instructions:
      en: "You will hear twelve sentences, each once. Some are fast, some sound like a phone, some have background noise. Type exactly what you hear, then press Done."
      ko: "열두 문장을 각각 한 번씩 듣습니다. 어떤 것은 빠르고, 어떤 것은 전화처럼 들리고, 어떤 것은 배경 소음이 있습니다. 들은 대로 정확히 입력한 뒤 완료를 누르세요."
    timing: { prep_s: 0, respond_s: 25 }
    allow_rerecord: false
    items:
      - { id: C6-01, text: "The pharmacy will text you when the order is ready.", audio: audio/core-C/C6-01.wav, target: { condition: clear } }
      - { id: C6-02, text: "Please arrive fifteen minutes before your appointment.", audio: audio/core-C/C6-02.wav, target: { condition: clear } }
      - { id: C6-03, text: "The doctor recommended a follow-up in six weeks.", audio: audio/core-C/C6-03.wav, target: { condition: clear } }
      - { id: C6-04, text: "Your test results will be posted to the patient portal.", audio: audio/core-C/C6-04.wav, fx: { rate: "+35%" }, target: { condition: fast } }
      - { id: C6-05, text: "Take the antibiotic until it is finished, even if you feel better.", audio: audio/core-C/C6-05.wav, fx: { rate: "+35%" }, target: { condition: fast } }
      - { id: C6-06, text: "The urgent care center closes at nine on weekdays.", audio: audio/core-C/C6-06.wav, fx: { rate: "+35%" }, target: { condition: fast } }
      - { id: C6-07, text: "Your claim was sent to the wrong address last month.", audio: audio/core-C/C6-07.wav, fx: { phone: true }, target: { condition: phone } }
      - { id: C6-08, text: "The specialist has an opening next Wednesday at ten.", audio: audio/core-C/C6-08.wav, fx: { phone: true }, target: { condition: phone } }
      - { id: C6-09, text: "Bring your photo ID and a list of your medications.", audio: audio/core-C/C6-09.wav, fx: { phone: true }, target: { condition: phone } }
      - { id: C6-10, text: "Call us if the swelling has not gone down by Monday.", audio: audio/core-C/C6-10.wav, fx: { noise_snr_db: 5, noise_kind: babble }, target: { condition: noise } }
      - { id: C6-11, text: "The clinic is on the second floor, next to the lab.", audio: audio/core-C/C6-11.wav, fx: { noise_snr_db: 5, noise_kind: babble }, target: { condition: noise } }
      - { id: C6-12, text: "You can pay the balance online or at the front desk.", audio: audio/core-C/C6-12.wav, fx: { noise_snr_db: 5, noise_kind: babble }, target: { condition: noise } }

  - id: C7
    type: rating
    title:
      en: "Confidence"
      ko: "자신감"
    instructions:
      en: "How confident do you feel speaking English in each situation right now? Move the slider and press Next."
      ko: "지금 각 상황에서 영어로 말하는 것이 얼마나 자신 있나요? 슬라이더를 움직이고 다음을 누르세요."
    timing: { prep_s: 0, respond_s: 60 }
    allow_rerecord: false
    items:
      - { id: C7-phone, prompt: { en: "On the phone", ko: "전화 통화에서" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
      - { id: C7-doctor, prompt: { en: "At the doctor's office", ko: "병원에서" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
      - { id: C7-colleagues, prompt: { en: "With colleagues", ko: "동료들과" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
      - { id: C7-church, prompt: { en: "At church", ko: "교회에서" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
      - { id: C7-class, prompt: { en: "In class", ko: "수업에서" }, scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } } }
