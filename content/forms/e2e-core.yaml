# Smoke-test form: one short item of every M1 task type. Kind "dummy" forms are hidden from the
# learner in production. Prompt audio is synthetic (server/scripts/make_e2e_audio.py).
id: e2e-core
version: 1
kind: dummy
title:
  en: "E2E core check"
  ko: "E2E 핵심 점검"
tasks:
  - id: C0
    type: silence
    title: { en: "Room noise", ko: "실내 소음" }
    instructions: { en: "Stay silent.", ko: "조용히 있어 주세요." }
    timing: { prep_s: 0, respond_s: 1 }
    allow_rerecord: false
    items:
      - id: C0-silence
        target: { purpose: noise_floor }
  - id: C1
    type: read_aloud
    title: { en: "Read aloud", ko: "소리 내어 읽기" }
    instructions: { en: "Read the sentence.", ko: "문장을 읽으세요." }
    timing: { prep_s: 1, respond_s: 2 }
    allow_rerecord: true
    items:
      - id: C1-01
        text: "The pharmacist said the refill would be ready after lunch."
        target: { words: 10 }
  - id: C2
    type: sentence_repeat
    title: { en: "Repeat", ko: "따라 말하기" }
    instructions: { en: "Listen, then repeat after the beep.", ko: "듣고 삐 소리 후 따라 말하세요." }
    timing: { prep_s: 0, respond_s: 2 }
    tone_hz: 880
    allow_rerecord: false
    items:
      - id: C2-01
        text: "The pharmacy closes at nine."
        audio: audio/e2e-core/C2-01.wav
        target: { syllables: 8 }
  - id: C3
    type: quick_answer
    title: { en: "Quick answer", ko: "빠른 대답" }
    instructions: { en: "Answer right away.", ko: "바로 대답하세요." }
    timing: { prep_s: 0, respond_s: 2 }
    tone_hz: 880
    allow_rerecord: false
    items:
      - id: C3-01
        text: "What time do you usually wake up?"
        audio: audio/e2e-core/C3-01.wav
        target: { type: personal }
  - id: C5
    type: describe_opinion
    title: { en: "Describe", ko: "묘사하기" }
    instructions: { en: "Think, then speak.", ko: "생각한 뒤 말하세요." }
    timing: { prep_s: 1, respond_s: 2 }
    allow_rerecord: false
    items:
      - id: C5-describe
        prompt: { en: "Describe a visit to a clinic.", ko: "병원 방문을 묘사하세요." }
        target: { stage: describe }
      - id: C5-opinion
        prompt: { en: "Should patients email their doctor?", ko: "환자가 의사에게 이메일을 보내야 할까요?" }
        timing: { prep_s: 1, respond_s: 2 }
        target: { stage: opinion }
  - id: C4
    type: phone_call
    title: { en: "Phone call", ko: "전화 통화" }
    instructions: { en: "Reply to the caller.", ko: "상대방에게 대답하세요." }
    timing: { prep_s: 0, respond_s: 2 }
    allow_rerecord: false
    target:
      scenario: "Reschedule your check-up."
      goals: ["Says why they are calling.", "Asks for Tuesday."]
      phrases: ["I'd like to reschedule"]
    items:
      - id: C4-01
        text: "Dr. Rivera's office, how can I help you?"
        audio: audio/e2e-core/C4-01.wav
        prompt: { en: "Say why you are calling.", ko: "왜 전화했는지 말하세요." }
  - id: C6
    type: dictation
    title: { en: "Dictation", ko: "받아쓰기" }
    instructions: { en: "Type what you hear.", ko: "들은 대로 입력하세요." }
    timing: { prep_s: 0, respond_s: 30 }
    items:
      - id: C6-01
        text: "Your prescription will be ready in twenty minutes."
        audio: audio/e2e-core/C6-01.wav
        target: { condition: phone }
  - id: C7
    type: rating
    title: { en: "Confidence", ko: "자신감" }
    instructions: { en: "Move the slider.", ko: "슬라이더를 움직이세요." }
    timing: { prep_s: 0, respond_s: 60 }
    items:
      - id: C7-phone
        prompt: { en: "On the phone", ko: "전화 통화에서" }
        scale: { min: 0, max: 10, labels: { "0": { en: "not at all", ko: "전혀" }, "10": { en: "completely", ko: "완전히" } } }
  - id: B4
    type: lexical_decision
    title: { en: "Word test", ko: "단어 판단" }
    instructions: { en: "Is it a word? F = no, J = yes.", ko: "단어인가요? F = 아니오, J = 예." }
    timing: { prep_s: 0, respond_s: 20 }
    items:
      - { id: L-a, text: "scornful", target: { is_word: true } }
      - { id: L-b, text: "kermshaw", target: { is_word: false } }
  - id: B5
    type: copy_typing
    title: { en: "Typing", ko: "타이핑" }
    instructions: { en: "Copy the text.", ko: "글을 따라 입력하세요." }
    timing: { prep_s: 0, respond_s: 30 }
    items:
      - id: B5-ko
        text: "병원에서 전화가 왔다."
        target: { language: ko }
  - id: R1
    type: multiple_choice
    title: { en: "Vocabulary", ko: "어휘" }
    instructions: { en: "Choose the meaning.", ko: "뜻을 고르세요." }
    timing: { prep_s: 0, respond_s: 30 }
    items:
      - { id: R1-01, text: "<u>fracture</u>: They found a fracture.", options: ["a break or crack", "a small animal", "a missing page", "a secret door"], target: { band: 10k, answer: 0 } }
  - id: R3-conv
    type: multiple_choice
    title: { en: "Conversation", ko: "대화" }
    instructions: { en: "Listen once, then answer.", ko: "한 번 듣고 답하세요." }
    timing: { prep_s: 0, respond_s: 30 }
    audio: audio/e2e-core/clip.wav
    target: { genre: conversation }
    items:
      - { id: R3-q1, text: "What did you hear?", options: ["A tone", "Silence"], target: { answer: 0 } }
  - id: R2-read
    type: reading_passage
    title: { en: "Timed reading", ko: "시간 측정 읽기" }
    instructions: { en: "Read, then press Done.", ko: "읽고 완료를 누르세요." }
    timing: { prep_s: 0, respond_s: 120 }
    target: { questions: R2-q, genre: patient_information }
    items:
      - id: R2-passage
        text: "Your appointment is on Tuesday at nine. Please arrive ten minutes early and bring your insurance card."
  - id: R2-q
    type: multiple_choice
    title: { en: "Questions", ko: "문제" }
    instructions: { en: "Answer from memory.", ko: "기억을 바탕으로 답하세요." }
    timing: { prep_s: 0, respond_s: 30 }
    target: { genre: patient_information }
    items:
      - { id: R2-q1, text: "When is the appointment?", options: ["Tuesday at nine", "Monday at ten"], target: { answer: 0 } }
  - id: R2-ctest
    type: c_test
    title: { en: "Complete the words", ko: "단어 완성" }
    instructions: { en: "Type the missing letters.", ko: "빠진 글자를 입력하세요." }
    timing: { prep_s: 0, respond_s: 60 }
    items:
      - { id: R2-c1, text: "The nurse called. She as{ked} me t{o} bring m{y} card.", target: { blanks: 3 } }
  - id: R3-axb
    type: axb
    title: { en: "Same or different?", ko: "같은 소리?" }
    instructions: { en: "A or B?", ko: "A 또는 B?" }
    timing: { prep_s: 0, respond_s: 10 }
    items:
      - { id: R3-axb-01, audio: audio/e2e-core/axb-01.wav, target: { answer: B, contrast: "r/l" } }
  - id: W1
    type: typed_response
    title: { en: "Typed", ko: "타이핑" }
    instructions: { en: "Type a short answer.", ko: "짧게 입력하세요." }
    timing: { prep_s: 0, respond_s: 30 }
    items:
      - id: W1-01
        prompt: { en: "Why did you call the clinic?", ko: "왜 병원에 전화했나요?" }
        target: { min_words: 5 }
